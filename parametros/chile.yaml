# =============================================================================
# Parámetros legales de Chile usados por las calculadoras de Saca la Cuenta
# =============================================================================
#
# Cada grupo tiene:
#   vigencias:        lista de entradas; cada una rige desde su fecha `desde`.
#                     El sitio elige sola la entrada vigente según la fecha del día,
#                     así que puedes cargar cambios futuros por adelantado.
#   revisar_antes_de: cuando llega esta fecha, el paso "verificar" de GitHub Actions
#                     falla y GitHub te manda un correo para que revises el grupo.
#                     Después de revisarlo, actualiza esta fecha.
#   fuente:           dónde verificar los valores.
#
# Última verificación general: 2026-10-12 (ver docs/MANTENCION.md).
# Los valores marcados "confianza: media" vienen de normas estables que conviene
# contrastar con el PDF mensual de indicadores de Previred.

afp:
  revisar_antes_de: 2027-04-01
  fuente: https://www.spensiones.cl/portal/institucional/594/w3-propertyvalue-9897.html
  vigencias:
    - desde: 2025-10-01
      cotizacion_obligatoria: 0.10   # DL 3.500, va a la cuenta individual
      administradoras:               # comisión sobre la remuneración imponible
        capital:   {nombre: Capital,   comision: 0.0144}
        cuprum:    {nombre: Cuprum,    comision: 0.0144}
        habitat:   {nombre: Habitat,   comision: 0.0127}
        modelo:    {nombre: Modelo,    comision: 0.0058}
        planvital: {nombre: PlanVital, comision: 0.0116}
        provida:   {nombre: ProVida,   comision: 0.0145}
        uno:       {nombre: Uno,       comision: 0.0046}   # 0,49% hasta sep-2025

topes_imponibles:
  # La Superintendencia de Pensiones los reajusta una vez al año por resolución,
  # según el Índice de Remuneraciones Reales (si es negativo, se mantienen). El mes
  # en que rigen puede variar: revisen la resolución de cada año.
  revisar_antes_de: 2027-02-01
  fuente: https://www.spensiones.cl/portal/institucional/594/w3-article-16921.html
  vigencias:
    - desde: 2026-01-01
      afp_salud_uf: 89.9     # Res. Ex. N°27/2026, luego corregida
      cesantia_uf: 135.1
    - desde: 2026-02-01
      afp_salud_uf: 90.0     # Res. SP N°237/2026 (también rige para salud y SIS)
      cesantia_uf: 135.2     # Res. N°236/2026

seguro_cesantia:
  # Ley 19.728, art. 5. El trabajador con contrato indefinido cotiza 0,6% solo durante
  # sus primeros 11 años con el mismo empleador.
  revisar_antes_de: 2027-06-01
  fuente: https://www.spensiones.cl/portal/institucional/594/w3-propertyvalue-9902.html
  vigencias:
    - desde: 2002-10-01
      trabajador: {indefinido: 0.006, plazo_fijo: 0.0, indefinido_11: 0.0}
      empleador:  {indefinido: 0.024, plazo_fijo: 0.03, indefinido_11: 0.008}

salud:
  revisar_antes_de: 2027-06-01
  fuente: https://www.superdesalud.gob.cl/
  vigencias:
    - desde: 2005-01-01
      tasa: 0.07   # cotización obligatoria Fonasa/Isapre, con el mismo tope de 90 UF

ingreso_minimo:
  # Próximo reajuste: 2027-01-01, según IPC de mayo a diciembre de 2026 (Ley 21.830).
  revisar_antes_de: 2027-01-02
  fuente: https://www.bcn.cl/leychile/navegar?idNorma=1225354
  vigencias:
    - desde: 2025-01-01
      monto: 510500        # $500.000 reajustado por el IPC de jul-dic 2024
      ley: Ley 21.578
    - desde: 2025-05-01
      monto: 529000
      ley: Ley 21.751
    - desde: 2026-01-01
      monto: 539000
      menores_18_mayores_65: 402082
      no_remuneracional: 347434
      ley: Ley 21.751
    - desde: 2026-05-01
      monto: 553553
      menores_18_mayores_65: 412938
      no_remuneracional: 356815
      ley: Ley 21.830 (publicada en junio de 2026, con efecto desde el 1 de mayo)

gratificacion:
  # Art. 50 del Código del Trabajo: 25% de lo devengado, con tope de 4,75 IMM al año.
  # El tope anual usa el ingreso mínimo vigente al 31 de diciembre; si sube durante
  # el año, el empleador reliquida (Dirección del Trabajo).
  revisar_antes_de: 2027-06-01
  fuente: https://www.bcn.cl/leychile/navegar?idNorma=207436
  vigencias:
    - desde: 2003-01-01
      tasa: 0.25
      tope_imm_anual: 4.75

impuesto_unico:
  # Tabla mensual del Impuesto Único de Segunda Categoría, en UTM (Ley 21.210).
  # impuesto = base × factor − rebaja × UTM. `hasta: null` = sin tope.
  revisar_antes_de: 2027-01-02
  fuente: https://www.sii.cl/valores_y_fechas/impuesto_2da_categoria/impuesto2026.htm
  vigencias:
    - desde: 2020-01-01
      tramos:
        - {hasta: 13.5, factor: 0.0,   rebaja: 0.0}
        - {hasta: 30,   factor: 0.04,  rebaja: 0.54}
        - {hasta: 50,   factor: 0.08,  rebaja: 1.74}
        - {hasta: 70,   factor: 0.135, rebaja: 4.49}
        - {hasta: 90,   factor: 0.23,  rebaja: 11.14}
        - {hasta: 120,  factor: 0.304, rebaja: 17.8}
        - {hasta: 310,  factor: 0.35,  rebaja: 23.32}
        - {hasta: null, factor: 0.40,  rebaja: 38.82}

retencion_honorarios:
  # Ley 21.133: sube 0,75 puntos al año desde 2020 (1 punto en 2028) hasta llegar a 17%.
  revisar_antes_de: 2028-12-01
  fuente: https://www.sii.cl/destacados/boletas_honorarios/index.html
  vigencias:
    - {desde: 2024-01-01, tasa: 0.1375}
    - {desde: 2025-01-01, tasa: 0.145}
    - {desde: 2026-01-01, tasa: 0.1525}
    - {desde: 2027-01-01, tasa: 0.16}
    - {desde: 2028-01-01, tasa: 0.17}

iva:
  # Tasa general del IVA (DL 825, art. 14): 19% desde el 1-10-2003 (Ley 19.888); la
  # Ley 20.102 (2006) derogó la vuelta al 18% prevista para 2007.
  # Se calcula sobre el neto y se redondea al peso. Para desglosar un precio con
  # IVA incluido: neto = total / (1 + tasa) redondeado al peso; IVA = total − neto.
  revisar_antes_de: 2027-10-01
  fuente: https://www.sii.cl/preguntas_frecuentes/impuestos_mensuales/001_130_0572.htm
  vigencias:
    - {desde: 2003-10-01, tasa: 0.19, ley: Ley 19.888}

impuesto_timbres:
  # Impuesto de Timbres y Estampillas de las operaciones de crédito de dinero
  # (DL 3.475, art. 1 N° 3, tasas de la Ley 20.780): 0,066% del monto por cada mes o fracción entre la
  # emisión y el vencimiento, con un máximo de 0,8% (13 meses o más); 0,332% si es
  # a la vista o sin plazo. Vigente desde el 1-1-2016 (SII, Circular N° 17 de 2015).
  revisar_antes_de: 2027-10-01
  fuente: https://www.sii.cl/documentos/circulares/2015/circu17.pdf
  vigencias:
    - {desde: 2016-01-01, tasa_mensual: 0.00066, tope: 0.008, a_la_vista: 0.00332}

apv:
  # Régimen B: rebaja la base del impuesto hasta 50 UF mensuales (600 UF al año).
  revisar_antes_de: 2027-06-01
  fuente: https://www.spensiones.cl/
  vigencias:
    - desde: 2011-01-01
      tope_mensual_uf: 50
      tope_anual_uf: 600
      bonificacion_regimen_a: 0.15
      tope_bonificacion_utm: 6

cotizaciones_empleador:
  # Reforma de pensiones (Ley 21.735). Desde agosto de 2026 el SIS va DENTRO del
  # aporte del empleador (3,5% = 0,1% cuenta individual + 0,9% rentabilidad
  # protegida + 2,5% seguro social que incluye el SIS). Antes se pagaba aparte.
  # mutual_basica: Ley 16.744, 0,90% básica + 0,03% Ley SANNA (sin la adicional por riesgo).
  # SIS 2026 según la Superintendencia de Pensiones: 1,54% desde enero, 1,62% desde abril y,
  # desde agosto, 1,78% dentro del 2,5% del seguro social (Oficio N° 15.295).
  revisar_antes_de: 2027-07-15
  fuente: https://www.chileatiende.gob.cl/fichas/130987-aportes-del-empleador-al-sistema-de-pensiones
  vigencias:
    - {desde: 2026-01-01, sis: 0.0154, aporte_reforma_pensiones: 0.010, mutual_basica: 0.0093}
    - {desde: 2026-04-01, sis: 0.0162, aporte_reforma_pensiones: 0.010, mutual_basica: 0.0093}
    - {desde: 2026-08-01, sis: 0.0,    aporte_reforma_pensiones: 0.035, mutual_basica: 0.0093}
    - {desde: 2027-08-01, sis: 0.0,    aporte_reforma_pensiones: 0.0425, mutual_basica: 0.0093}
    - {desde: 2028-08-01, sis: 0.0,    aporte_reforma_pensiones: 0.050, mutual_basica: 0.0093}
    - {desde: 2029-08-01, sis: 0.0,    aporte_reforma_pensiones: 0.057, mutual_basica: 0.0093}

indemnizaciones:
  # Código del Trabajo: indemnización por años de servicio (art. 163, tope de 11
  # años para contratos desde el 14-ago-1981), tope de 90 UF de la remuneración
  # para indemnizaciones (art. 172) y feriado anual de 15 días hábiles (art. 67).
  revisar_antes_de: 2027-06-01
  fuente: https://www.dt.gob.cl/
  vigencias:
    - desde: 1990-01-01
      tope_remuneracion_uf: 90
      tope_anios: 11
      feriado_dias_habiles_anuales: 15

jornada_laboral:
  # Jornada ordinaria máxima semanal (art. 22 del Código del Trabajo). La Ley 21.561
  # la rebaja de forma gradual: 44 h desde el 26-04-2024, 42 h desde el 26-04-2026 y
  # 40 h desde el 26-04-2028. Las horas extra se pagan con un recargo de 50% sobre el
  # sueldo convenido (art. 32). La DT calcula la hora ordinaria con sueldo mensual como
  # sueldo / 30 × 28 / (4 × jornada semanal).
  revisar_antes_de: 2027-10-01
  fuente: https://www.dt.gob.cl/portal/1628/w3-article-95182.html
  vigencias:
    - {desde: 2005-01-01, horas_semanales: 45, recargo_horas_extra: 0.5}   # Ley 19.759
    - {desde: 2024-04-26, horas_semanales: 44, recargo_horas_extra: 0.5}   # Ley 21.561
    - {desde: 2026-04-26, horas_semanales: 42, recargo_horas_extra: 0.5}
    - {desde: 2028-04-26, horas_semanales: 40, recargo_horas_extra: 0.5}

credito_hipotecario:
  # Tasa anual de referencia para los ejemplos de dividendo (no es una oferta).
  # Revísala cada trimestre en https://www.cmfchile.cl o en los simuladores de los bancos.
  revisar_antes_de: 2027-01-15
  fuente: https://www.cmfchile.cl/
  vigencias:
    - desde: 2026-01-01
      tasa_referencia: 0.042
      carga_financiera_maxima: 0.25   # los bancos suelen exigir dividendo <= 25% de la renta

credito_consumo:
  # Tasa de interés MENSUAL de ejemplo para el simulador de crédito de consumo (no es
  # una oferta). Compárala cada trimestre con los simuladores de los bancos y con la
  # tasa máxima convencional (TMC) que publica la CMF.
  revisar_antes_de: 2027-01-15
  fuente: https://www.cmfchile.cl/
  vigencias:
    - desde: 2026-01-01
      tasa_mensual_ejemplo: 0.015

# La UTM se reajusta cada mes con el IPC de dos meses antes. Este valor indica si
# la UTM se mantiene cuando ese IPC es negativo (true) o si baja (false). Lo valida
# el test `test_utm_contra_datos_reales` con los datos reales descargados.
utm_se_mantiene_con_ipc_negativo: false

feriados_extra:
  # Feriados por elecciones o leyes especiales (los feriados normales se calculan
  # solos en lucas/feriados.py). Ley 18.700 art. 169: los días de elecciones son
  # feriado legal. Próximas elecciones esperadas: municipales y regionales el
  # 2028-10-29 y presidenciales el 2029-11-18 (confirmar con el Servel y agregarlas).
  revisar_antes_de: 2027-12-01
  fuente: https://www.gob.cl/noticias/feriados-2026-revisa-cuantos-habra-y-cuales-son-irrenunciables/
  lista:
    - fecha: 2025-11-16
      nombre: Elecciones presidenciales y parlamentarias
      nota: Feriado electoral (irrenunciable para trabajadores de centros comerciales)
    - fecha: 2025-12-14
      nombre: Segunda vuelta presidencial
      nota: Feriado electoral (irrenunciable para trabajadores de centros comerciales)
